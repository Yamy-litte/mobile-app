name: Android build and unit tests

on:
  push:
    paths:
      - "LibraryApp/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "LibraryApp/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LibraryApp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use available API 36 for CI compile check
        run: |
          # GitHub's Android SDK repository does not currently publish API 37.
          # Temporarily lower SDK values only in the CI checkout; app config on main is unchanged.
          sed -i 's/version = release(37)/version = release(36)/' app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' app/build.gradle.kts

      - name: Build debug APK and run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
